name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'pkg/**'
      - 'cmd/**'
      - 'test/**'
      - 'rules/**'
  pull_request:
    branches: [main]
    paths:
      - 'pkg/**'
      - 'cmd/**'
      - 'test/**'
      - 'rules/**'
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Validate Rules (Falco-free static check)
        # Phase 6: protect against rule regressions in CI even on runners
        # without a Falco binary. tools/rule-validator runs P003/P005 source
        # checks plus YAML schema and macro/list resolution.
        run: make validate-rules

      - name: Level 1 - Pattern Coverage Tests
        run: make e2e-pattern

      - name: Level 2 - Pipeline Tests
        run: make e2e-pipeline

      - name: Save Test Output
        if: always()
        run: |
          mkdir -p e2e-results
          go test ./test/e2e/ -v -run TestPattern -count=1 > e2e-results/pattern.log 2>&1 || true
          go test ./cmd/plugin-sdk/ -v -run TestPipeline -count=1 -timeout 120s > e2e-results/pipeline.log 2>&1 || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-results/
          retention-days: 30

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Install Allure CLI
        run: |
          curl -L -o /tmp/allure.tgz https://github.com/allure-framework/allure2/releases/latest/download/allure-2.27.0.tgz
          tar -xzf /tmp/allure.tgz -C /tmp/
          sudo ln -sf /tmp/allure-2.27.0/bin/allure /usr/local/bin/allure
          allure --version

      - name: Generate Allure results
        run: $(go env GOPATH)/bin/gotestsum --junitfile allure-results/junit.xml --format pkgname -- -count=1 ./...
        continue-on-error: true

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results -o allure-report --clean

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # ----------------------------------------------------------------------
      # openclaw-style Falco scenario Allure report (`make allure-falco`).
      # Generates Epic/Feature/Story tree + Markdown descriptions + Falco
      # alert evidence with HTML highlighting. Independent from the
      # gotestsum/JUnit `allure-report` artifact above — this one consumes
      # test/integration/results/test-results.json produced by the
      # `go test -tags=allure ./test/integration/...` step.
      #
      # Deliberately disabled in CI for v0.1.0 (continue-on-error: true) until
      # we can install Falco on the runner and validate end-to-end. Locally
      # `make allure-falco` produces the report against the host's ~/bin/
      # falco. See PHASE_ALLURE_FALCO_LOG.md §5.2 #3.
      # ----------------------------------------------------------------------
      - name: Set up Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install allure-pytest
        if: always()
        run: pip install -r test/allure/requirements.txt
        continue-on-error: true

      - name: Generate Falco scenario test-results.json
        # Requires a Falco binary; CI runner has none in v0.1.0 so this
        # step gracefully fails-soft. Local devs use `make allure-falco`.
        if: always()
        run: go test -tags=allure -count=1 ./test/integration/... -run "TestL3_Falco_(Categories|BenignNoFalsePositive|Heartbeat)" -timeout 120s
        continue-on-error: true

      - name: Run Falco scenario pytest wrapper
        if: always()
        run: |
          if [ -f test/integration/results/test-results.json ]; then
            cd test/allure && python3 -m pytest test_e2e_wrapper.py \
              --test-results=../../test/integration/results/test-results.json \
              --alluredir=../../allure-results-falco -v
          else
            echo "test-results.json not produced (Falco binary unavailable on CI runner). Skipping pytest wrapper."
          fi
        continue-on-error: true

      - name: Generate Falco scenario Allure report
        if: always()
        run: |
          if [ -d allure-results-falco ] && [ -n "$(ls -A allure-results-falco 2>/dev/null)" ]; then
            allure generate allure-results-falco -o allure-report-falco --clean
          else
            echo "allure-results-falco empty. Skipping report generation."
          fi
        continue-on-error: true

      - name: Upload Falco scenario Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-falco
          path: allure-report-falco/
          retention-days: 30
          if-no-files-found: ignore
